name: R checks and synthetic reports

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - name: Check core and HTML without optional packages
        run: Rscript --vanilla tests/run_tests.R
      - name: Install Excel support
        run: Rscript --vanilla scripts/install_optional.R
      - name: Check calculations and workbook output
        run: Rscript --vanilla tests/run_tests.R
      - name: Generate the complete synthetic report
        run: Rscript --vanilla run.R --demo --output outputs/ci-demo
      - name: Check Excel charts and summary sheets
        shell: Rscript {0}
        run: |
          file <- "outputs/ci-demo/monitoring-report.xlsx"
          stopifnot(file.exists(file))
          sheets <- openxlsx::getSheetNames(file)
          stopifnot(all(c("Overview", "Patient charts", "Unit charts", "Definitions", "Patients") %in% sheets))
          zip <- unzip(file, list = TRUE)
          stopifnot(sum(grepl("^xl/media/.*[.]png$", zip$Name)) == 16L)
          data <- openxlsx::read.xlsx(file, sheet = "Patients")
          stopifnot(sum(data$band == "Total") == 6L)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-report-${{ matrix.os }}
          path: outputs/ci-demo/
          retention-days: 14
          if-no-files-found: error
